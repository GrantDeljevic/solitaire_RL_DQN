name: Tests
on:
  push:
  pull_request:
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest -v test
      - run: python network.py --episodes 2 --warmup 1 --batch-size 2 --eval-every 2 --eval-games 2 --max-steps 30 --max-stall 15 --no-tensorboard
